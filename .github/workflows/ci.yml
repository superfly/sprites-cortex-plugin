name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Validate repository files
        run: python scripts/check_repository.py

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

  cortex-validate:
    name: Cortex CLI validation (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Cortex Code CLI
        env:
          CORTEX_ARCHIVE: coco-1.1.60+201022.a3e8fc953384-linux-amd64.tar.gz
          CORTEX_SHA256: 6dbde95a729174a7b171861a49a37401afbe7465a9d8bcada7281460e2736a5c
          CORTEX_URL: https://sfc-repo.snowflakecomputing.com/cortex-code-cli/a4643c4278/1.1.60%2B201022.a3e8fc953384/coco-1.1.60%2B201022.a3e8fc953384-linux-amd64.tar.gz
        run: |
          curl --fail --location --silent --show-error --retry 3 "$CORTEX_URL" --output "$RUNNER_TEMP/$CORTEX_ARCHIVE"
          echo "$CORTEX_SHA256  $RUNNER_TEMP/$CORTEX_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cortex"
          tar -xzf "$RUNNER_TEMP/$CORTEX_ARCHIVE" --directory "$RUNNER_TEMP/cortex" --strip-components=1

      - name: Validate with Cortex Code CLI
        run: |
          "$RUNNER_TEMP/cortex/cortex" plugin validate
