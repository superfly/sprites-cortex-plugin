name: Bug report
description: Report a reproducible problem with the Sprites plugin for Cortex Code.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the plugin. Do not include credentials, tokens, cookies, private data, or production logs. Report vulnerabilities through the private security link instead.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version from `.cortex-plugin/plugin.json` or the Git tag.
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: cortex-version
    attributes:
      label: Cortex Code version
      description: Output from `cortex --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and whether you use Cortex Code CLI or Desktop.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence, with sensitive values redacted.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only bounded, redacted output.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, tokens, cookies, private data, and production logs.
          required: true
        - label: This is not a security vulnerability.
          required: true
